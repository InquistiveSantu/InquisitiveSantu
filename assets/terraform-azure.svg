<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 222" width="820" height="222" role="img" aria-label="Conceptual diagram showing Terraform configuration files provisioning four Azure resources: Hub Virtual Network, Spoke Virtual Network, Azure RBAC, and Azure Monitor. Each resource lights up sequentially to represent provisioning.">
  <defs>
    <style>
      .ttl  { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.5px; fill: #58A6FF; text-anchor: middle; letter-spacing: 1.5px; }
      .tab  { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #8B949E; }
      .code { font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; }
      .kw   { fill: #FF7B72; }
      .def  { fill: #E6EDF3; }
      .cmt  { fill: #8B949E; }
      .str  { fill: #79C0FF; }
      .rlbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #E6EDF3; text-anchor: middle; dominant-baseline: middle; }
      .rsub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9px; fill: #8B949E; text-anchor: middle; dominant-baseline: middle; }
      .albl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #0078D4; text-anchor: middle; }
      @keyframes dash {
        from { stroke-dashoffset: 24; }
        to   { stroke-dashoffset: 0;  }
      }
      @keyframes resGlow {
        0%,100% { fill: #161B22; stroke: #30363D; }
        10%     { fill: #0A2540; stroke: #0078D4; }
        20%     { fill: #161B22; stroke: #30363D; }
      }
      @keyframes blink {
        0%,49% { opacity: 1; }
        50%,100%{ opacity: 0; }
      }
      .arrow-dash { stroke-dasharray: 7 4; animation: dash 0.7s linear infinite; }
      .r1 { animation: resGlow 3.6s 0.00s infinite; }
      .r2 { animation: resGlow 3.6s 0.90s infinite; }
      .r3 { animation: resGlow 3.6s 1.80s infinite; }
      .r4 { animation: resGlow 3.6s 2.70s infinite; }
      .cursor { animation: blink 1.1s step-end infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="820" height="222" fill="#0D1117" rx="10"/>

  <!-- Title -->
  <text class="ttl" x="410" y="14">TERRAFORM INFRASTRUCTURE PROVISIONING  ·  CONCEPTUAL DIAGRAM</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- LEFT: Terraform code block                          -->
  <!-- ═══════════════════════════════════════════════════ -->
  <!-- Outer box -->
  <rect x="14" y="20" width="316" height="192" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <!-- Header bar background -->
  <rect x="14" y="20" width="316" height="27" rx="8" fill="#1A202C" stroke="#30363D" stroke-width="1"/>
  <!-- Fill bottom half of header bar to square it -->
  <rect x="14" y="33" width="316" height="14" fill="#1A202C"/>
  <!-- File tab pill -->
  <rect x="21" y="24" width="60" height="18" rx="4" fill="#0D1117"/>
  <text class="tab" x="30" y="37">main.tf</text>
  <!-- Separator -->
  <line x1="14" y1="47" x2="330" y2="47" stroke="#30363D" stroke-width="0.5"/>

  <!-- Code lines: x=24, baseline start y=62, line-height=18 -->
  <!-- Line 1 -->
  <text class="code kw"  x="24" y="62">resource</text>
  <text class="code str" x="73" y="62">"azurerm_vnet"</text>
  <text class="code def" x="178" y="62">"hub" {</text>
  <!-- Line 2 -->
  <text class="code def" x="24" y="80">  name</text>
  <text class="code def" x="59" y="80"> = </text>
  <text class="code str" x="80" y="80">"hub-vnet"</text>
  <!-- Line 3 -->
  <text class="code def" x="24" y="98">  location</text>
  <text class="code def" x="81" y="98"> = </text>
  <text class="code str" x="102" y="98">"eastus"</text>
  <!-- Line 4 -->
  <text class="code def" x="24" y="116">  address_space = [...]</text>
  <!-- Line 5 -->
  <text class="code def" x="24" y="134">}</text>
  <!-- Line 6: blank -->
  <!-- Line 7 -->
  <text class="code kw"  x="24" y="152">module</text>
  <text class="code str" x="70" y="152"> "landing_zone"</text>
  <text class="code def" x="181" y="152"> {</text>
  <!-- Line 8 -->
  <text class="code def" x="24" y="170">  source</text>
  <text class="code def" x="72" y="170"> = </text>
  <text class="code str" x="93" y="170">"./modules/azure"</text>
  <!-- Line 9 -->
  <text class="code cmt" x="24" y="188">  # RBAC · Monitor · Peering</text>
  <!-- Line 10 -->
  <text class="code def" x="24" y="206">}</text>
  <!-- Blinking cursor -->
  <text class="code def cursor" x="33" y="206">|</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- CENTER: Animated dashed arrow                       -->
  <!-- ═══════════════════════════════════════════════════ -->
  <!-- Arrow label -->
  <text class="albl" x="384" y="104">Provisions</text>
  <!-- Dashed animated arrow line: 330 → 438 at y=116 (center of left box) -->
  <line class="arrow-dash" x1="330" y1="116" x2="438" y2="116" stroke="#0078D4" stroke-width="2.5"/>
  <!-- Arrowhead -->
  <polygon points="438,110 450,116 438,122" fill="#0078D4"/>

  <!-- Tree fan connectors: from x=450, y=116 → each resource center -->
  <!-- Vertical spine on left edge of resources -->
  <line x1="450" y1="38" x2="450" y2="194" stroke="#30363D" stroke-width="1"/>
  <!-- Main horizontal from arrow tip to spine -->
  <line x1="450" y1="116" x2="451" y2="116" stroke="#30363D" stroke-width="1"/>
  <!-- Branch h-lines to each box left edge (x=466) -->
  <line x1="450" y1="38"  x2="466" y2="38"  stroke="#30363D" stroke-width="1"/>
  <line x1="450" y1="90"  x2="466" y2="90"  stroke="#30363D" stroke-width="1"/>
  <line x1="450" y1="142" x2="466" y2="142" stroke="#30363D" stroke-width="1"/>
  <line x1="450" y1="194" x2="466" y2="194" stroke="#30363D" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- RIGHT: Azure Resource Boxes                         -->
  <!-- x=466, width=340, each height=40, gap=10           -->
  <!-- r1 y=18, r2 y=68, r3 y=118, r4 y=168              -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- r1: Hub VNet  y=18..58  center y=38 -->
  <rect class="r1" x="466" y="18" width="340" height="40" rx="6" stroke-width="1.5"/>
  <text class="rlbl" x="636" y="33">Hub Virtual Network</text>
  <text class="rsub" x="636" y="48">azurerm_virtual_network · Hub-Spoke</text>

  <!-- r2: Spoke VNet  y=70..110  center y=90 -->
  <rect class="r2" x="466" y="70" width="340" height="40" rx="6" stroke-width="1.5"/>
  <text class="rlbl" x="636" y="85">Spoke Virtual Network</text>
  <text class="rsub" x="636" y="100">azurerm_virtual_network · Peering</text>

  <!-- r3: Azure RBAC  y=122..162  center y=142 -->
  <rect class="r3" x="466" y="122" width="340" height="40" rx="6" stroke-width="1.5"/>
  <text class="rlbl" x="636" y="137">Azure RBAC</text>
  <text class="rsub" x="636" y="152">azurerm_role_assignment · Access Control</text>

  <!-- r4: Azure Monitor  y=174..214  center y=194 -->
  <rect class="r4" x="466" y="174" width="340" height="40" rx="6" stroke-width="1.5"/>
  <text class="rlbl" x="636" y="189">Azure Monitor</text>
  <text class="rsub" x="636" y="204">azurerm_monitor_workspace · Observability</text>
</svg>
